name: Visual QA
on:
  push:
    branches: [main]
    paths: [index.html, .github/workflows/visual.yml]
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Serve
        run: |
          python3 -m http.server 8000 >/tmp/server.log 2>&1 &
          sleep 2
      - name: Syntax check
        run: |
          python3 - <<'PY'
          import re
          s=open('index.html',encoding='utf-8').read()
          blocks=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert blocks, 'inline script not found'
          open('/tmp/game.js','w',encoding='utf-8').write(blocks[-1])
          PY
          node --check /tmp/game.js
      - name: Functional test and captures
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-angle=swiftshader --enable-unsafe-swiftshader --virtual-time-budget=90000 --dump-dom 'http://127.0.0.1:8000/?selftest=1' >/tmp/dom.txt 2>/tmp/chrome.err || true
          grep -A40 'SELFTEST:' /tmp/dom.txt || true
          grep -q 'SELFTEST:PASS' /tmp/dom.txt
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-angle=swiftshader --enable-unsafe-swiftshader --window-size=1440,900 --virtual-time-budget=50000 --screenshot=visual.png 'http://127.0.0.1:8000/?preview=1' >/tmp/preview.out 2>>/tmp/chrome.err || true
          test -s visual.png
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-angle=swiftshader --enable-unsafe-swiftshader --window-size=390,844 --virtual-time-budget=50000 --screenshot=mobile.png 'http://127.0.0.1:8000/?preview=1' >/tmp/mobile.out 2>>/tmp/chrome.err || true
          test -s mobile.png
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-angle=swiftshader --enable-unsafe-swiftshader --window-size=1440,900 --virtual-time-budget=50000 --screenshot=night.png 'http://127.0.0.1:8000/?night=1' >/tmp/night.out 2>>/tmp/chrome.err || true
          test -s night.png
          grep -Ei 'Uncaught|TypeError|ReferenceError|SyntaxError|ERR_FAILED|404|CORS' /tmp/chrome.err | tail -n 100 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-qa
          path: |
            visual.png
            mobile.png
            night.png
            /tmp/dom.txt
            /tmp/chrome.err
