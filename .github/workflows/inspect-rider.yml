name: Inspect Paver Candidate
on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-rider.yml]
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download candidates
        run: |
          curl -L --fail -o /tmp/road.glb https://cdn.3dassets.dev/assets/79/v1/model.glb
          cp /tmp/road.glb /tmp/mannequin.glb
      - name: Inspect GLBs
        run: |
          python3 - <<'PY'
          import struct,json,os
          def read(path):
              b=open(path,'rb').read(); magic,ver,total=struct.unpack_from('<III',b,0); off=12; js=None
              while off<total:
                  ln,typ=struct.unpack_from('<II',b,off); off+=8; chunk=b[off:off+ln]; off+=ln
                  if typ==0x4E4F534A:
                      js=json.loads(chunk.decode('utf-8').rstrip('\x00 \t\r\n')); break
              print('\n===',os.path.basename(path),'size',len(b),'===')
              print('MATERIALS')
              for i,m in enumerate(js.get('materials',[])):
                  p=m.get('pbrMetallicRoughness',{})
                  print(i,m.get('name'),'base',p.get('baseColorFactor'),'metal',p.get('metallicFactor'),'rough',p.get('roughnessFactor'),'emissive',m.get('emissiveFactor'),'alpha',m.get('alphaMode'))
              print('NODES')
              for i,n in enumerate(js.get('nodes',[])):
                  if n.get('mesh') is not None or n.get('name'):
                      print(i,n.get('name'),'mesh',n.get('mesh'),'T',n.get('translation'),'R',n.get('rotation'),'S',n.get('scale'))
              print('MESHES')
              for i,m in enumerate(js.get('meshes',[])):
                  mats=[p.get('material') for p in m.get('primitives',[])]
                  print(i,m.get('name'),'materials',mats)
          read('/tmp/road.glb');read('/tmp/mannequin.glb')
          PY
